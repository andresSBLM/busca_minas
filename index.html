<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca minas</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main id="principal">

    </main>
    <section>
        <div id="puntos"></div>
        <div id="restantes"></div>
        <div id="minas"></div>
    </section>
    <footer>
        <a href="index.html">Reiniciar</a>
    </footer>
    <script>
        const PUNTOS = document.getElementById("puntos");
        const RESTANTES = document.getElementById("restantes")
        const MINAS = document.getElementById("minas");
        const TAMAÑO_TABLERO = 20;
        var celdas_limpiadas = 0;
        var total_celdas_limpias = 0;
        var minas = 0;
        PUNTOS.textContent = celdas_limpiadas;



        function terminar_partida() {
            alert("Has perdido");
            window.location.href = "index.html";
        }

        function victoria() {
            setTimeout(() => {
                alert("Has ganado");
                window.location.href = "index.html";
            }, 1000);
        }

        function construir_tablero() {
            const MAIN = document.getElementById("principal");
            for (let y = 1; y <= TAMAÑO_TABLERO; y++) {
                const DIV = document.createElement("div");
                for (let x = 1; x <= TAMAÑO_TABLERO; x++) {
                    const NUMERO = (Math.random()) * 11;
                    const P = document.createElement("p");
                    P.dataset.ejex = x;
                    P.dataset.ejey = y;
                    if (NUMERO <= 1) {
                        P.classList.add("bomba");
                        minas++;
                    } else {
                        total_celdas_limpias++;
                    }
                    P.addEventListener('click', () => {
                        if (P.classList == "bomba") {
                            escanear_todo();
                            setTimeout(() => {
                                terminar_partida();
                            }, 1000);
                        } else if (P.dataset.minas != 0) {
                            celdas_limpiadas++;
                            if (celdas_limpiadas == total_celdas_limpias) {
                                victoria();
                                return;
                            }
                            PUNTOS.textContent = celdas_limpiadas;
                            const CLASES = ["vacio", "uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho"];
                            const NUMERO = P.dataset.minas;
                            const CLASE = CLASES[NUMERO];
                            P.classList.add(CLASE);
                            P.textContent = NUMERO;
                        } else {
                            explorar_entorno(parseInt(P.dataset.ejex), parseInt(P.dataset.ejey));
                        }
                    });
                    DIV.appendChild(P);
                }
                MAIN.appendChild(DIV);
            }
            RESTANTES.textContent = total_celdas_limpias;
            MINAS.textContent = minas;
        }

        construir_tablero();

        function minas_alrededor() {
            const BOTONES = document.getElementsByTagName("p");
            for (let P of BOTONES) {
                if (P.classList != "bomba") {

                    const EJE_X = parseInt(P.dataset.ejex);
                    const EJE_Y = parseInt(P.dataset.ejey);
                    var contador = 0;
                    console.log("NUEVO RECUENTO");
                    for (let x = -1; x <= 1; x++) {
                        for (let y = -1; y <= 1; y++) {
                            if (x === 0 && y === 0) {
                                continue;
                            }
                            const elemento = document.querySelector(`[data-ejex="${EJE_X + x}"][data-ejey="${EJE_Y + y}"]`);
                            try {
                                if (elemento.classList == "bomba") {
                                    contador++;
                                }
                            } catch (err) {
                                console.log(EJE_X + " " + EJE_Y + " No tiene elemento");
                            }
                        }
                    }
                    P.dataset.minas = contador;
                }
            }
        }

        minas_alrededor();

        function escanear_todo() {
            const BOTONES = document.getElementsByTagName("p");
            for (let boton of BOTONES) {
                if (boton.classList == "bomba") {
                    boton.classList.remove("bomba");
                    boton.classList.add("bomba_activa");
                    continue;
                }
                switch (boton.dataset.minas) {
                    case "0":
                        boton.classList.add("vacio");
                        break;
                    case "1":
                        boton.classList.add("uno");
                        boton.textContent = 1;
                        break;
                    case "2":
                        boton.classList.add("dos");
                        boton.textContent = 2;
                        break;
                    case "3":
                        boton.classList.add("tres");
                        boton.textContent = 3;
                        break;
                    case "4":
                        boton.classList.add("cuatro");
                        boton.textContent = 4;
                        break;
                    case "5":
                        boton.classList.add("cinco");
                        boton.textContent = 5;
                        break;
                    case "6":
                        boton.classList.add("seis");
                        boton.textContent = 6;
                        break;
                    case "7":
                        boton.classList.add("siete");
                        boton.textContent = 7;
                        break;
                    case "8":
                        boton.classList.add("ocho");
                        boton.textContent = 8;
                        break;
                    default:
                        if (boton.classList == "bomba") {
                            boton.textContent = "";
                        }
                }
            }
            total_celdas_limpias = 0;
            PUNTOS.textContent = total_celdas_limpias;
        }

        function explorar_entorno(x, y) {
            const CLASES = ["vacio", "uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho"];
            for (let x2 = -1; x2 <= 1; x2++) {
                for (let y2 = -1; y2 <= 1; y2++) {
                    if (x2 === 0 && y2 === 0) {
                        continue;
                    }
                    const ELEMENTO = document.querySelector(`[data-ejex="${x + x2}"][data-ejey="${y + y2}"]`);
                    if (ELEMENTO) {
                        if (!ELEMENTO.dataset.vista) {
                            if (ELEMENTO.classList != "bomba") {
                                celdas_limpiadas++;
                                if (celdas_limpiadas == total_celdas_limpias) {
                                    victoria();
                                    return;
                                }
                                
                                if (ELEMENTO.dataset.minas == 0) {
                                    ELEMENTO.dataset.vista = "vacio";
                                    ELEMENTO.classList.add("vacio");
                                    const NUEVO_EJEX = parseInt(ELEMENTO.dataset.ejex);
                                    const NUEVO_EJEY = parseInt(ELEMENTO.dataset.ejey);
                                    explorar_entorno(NUEVO_EJEX, NUEVO_EJEY);
                                } else {
                                    const NUMERO = parseInt(ELEMENTO.dataset.minas);
                                    const CLASE = CLASES[NUMERO];
                                    ELEMENTO.classList.add(CLASE);
                                    ELEMENTO.textContent = NUMERO;
                                    ELEMENTO.dataset.vista = "numero";
                                }
                            }
                        }
                    }

                }
            }
            PUNTOS.textContent = celdas_limpiadas;
        }

    </script>
</body>

</html>
